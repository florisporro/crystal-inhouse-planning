services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    # .env on the server provides ORIGIN, BETTER_AUTH_SECRET, POSTMARK_TOKEN, POSTMARK_FROM
    env_file: .env
    environment:
      DATABASE_URL: file:/data/local.db
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          'const r = await fetch("http://localhost:3000/"); if (!r.ok) process.exit(1)'
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
